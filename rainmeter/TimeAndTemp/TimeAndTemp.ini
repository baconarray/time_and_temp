[Rainmeter]
; Sign.lua counts these 25 ms ticks to time the slides and fades.
Update=25
AccurateText=1
ContextTitle=Edit settings
ContextAction=["#@#Settings.inc"]

[Metadata]
Name=Time and Temp
Information=A copy of the light sign on the Time and Temperature building in Portland, ME. Settings live in @Resources\Settings.inc.

@Include=#@#Settings.inc

; ---------------------------------------------------------------- Weather
; Zip code -> latitude/longitude, then the current temperature from
; Open-Meteo (no API key). The weather measure stays disabled until the
; lookup finishes, then refreshes every 10 minutes (24000 x 25 ms).

[MeasureGeocode]
Measure=WebParser
URL=https://geocoding-api.open-meteo.com/v1/search?name=#ZipCode#&count=1&countryCode=#Country#
RegExp=(?s)"latitude":(-?[\d.]+),"longitude":(-?[\d.]+)
UpdateRate=3456000
FinishAction=[!UpdateMeasure MeasureLat][!UpdateMeasure MeasureLon][!EnableMeasure MeasureWeather][!CommandMeasure MeasureWeather "Update"]

[MeasureLat]
Measure=WebParser
URL=[MeasureGeocode]
StringIndex=1

[MeasureLon]
Measure=WebParser
URL=[MeasureGeocode]
StringIndex=2

[MeasureWeather]
Measure=WebParser
URL=https://api.open-meteo.com/v1/forecast?latitude=[MeasureLat]&longitude=[MeasureLon]&current=temperature_2m&temperature_unit=#TempUnit#
RegExp=(?s)"current":\{.*"temperature_2m":(-?[\d.]+)
UpdateRate=24000
DynamicVariables=1
Disabled=1
FinishAction=[!UpdateMeasure MeasureTemp]

[MeasureTemp]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=1

; ---------------------------------------------------------------- Sign

[MeasureSign]
Measure=Script
ScriptFile=#@#Sign.lua

; Sign.lua fills in every shape: the background, then the 4 x 45 character
; lights, then the two colon lights.
[MeterSign]
Meter=Shape
Shape=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
DynamicVariables=1
